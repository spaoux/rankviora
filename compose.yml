name: rankviora
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
    environment: &app-environment
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8088}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: rankviora
      DB_USERNAME: rankviora
      DB_PASSWORD: ${DB_PASSWORD:?Run deploy/setup.ps1 first}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RANKVIORA_PORT:-8088}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      assets:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    entrypoint: [php, artisan, queue:work, redis, --queue=seo, --sleep=2, --tries=5, --timeout=600, --max-time=3600]
    stop_grace_period: 610s
    volumes:
      - ./app:/var/www/html
    environment: *app-environment
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "php -r 'exit(str_contains(file_get_contents(\"/proc/1/cmdline\"),\"queue:work\")?0:1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rankviora
      POSTGRES_USER: rankviora
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run deploy/setup.ps1 first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rankviora -d rankviora"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  assets:
    image: node:22-alpine
    working_dir: /app
    command: [sh, -c, "npm ci --ignore-scripts && npm run build"]
    restart: on-failure:3
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
volumes:
  postgres_data:
  redis_data:
  node_modules:
